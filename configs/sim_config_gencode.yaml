repo_path: '.'

nthreads: 20
max_mem_mb: 14000

soloCellFilter: "EmptyDrops_CR"
cell_filtering: "emptydrops"
soloMultiMappers: "Unique"
soloUMIdedup: "Exact"
extraStarSoloArgs: ""

working_dir: output/simul_gencode

## gencode-style GTF: the simulator places transcript_id right after gene_id,
## a different attribute order than the ensembl configs. Checks that get_txp2gene
## parses by attribute name rather than by fixed column position.
gtf_origin: "gencode"

genomeSAindexNbases: 7
sjdbOverhang: 99

skip_sampletags: false
use_simulated: true

sim_n_cells: 1000
sim_n_genes: 100
sim_n_umis: 100
sim_seed: 42
sim_chr_len: 2000
sim_gene_pos: 1000
sim_read_len: 100

sim_n_empty_droplets: 50000

sampletag_fa: "data/sampletags/mouse_sampletags.fa"
sim_n_sampletags: 3
sim_n_st_reads: 100

## get_txp2gene only runs in alevin mode, so alevin is the aligner that triggers it
aligner:
  - alevin

samples:
  - name: simulated
    uses:
      allowedlist: 384
      diversity_insets: yes
      use_sampletags: yes
      species: 'mouse'
