repo_path: '.'

nthreads: 10
max_mem_mb: 20000

soloCellFilter: "EmptyDrops_CR"
soloMultiMappers: "Unique"
extraStarSoloArgs: ""

working_dir: output/testrun

gtf_origin: "gencode"
# https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_46/gencode.v46.primary_assembly.annotation.gtf.gz
# caution: uncompressed
gtf: /home/jiayiwang/rhapsodist/data/reference/gencode.v46.primary_assembly.annotation.gtf

# https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_46/GRCh38.p14.genome.fa.gz
# caution: uncompressed
genome: /home/jiayiwang/rhapsodist/data/reference/GRCh38.p14.genome.fa

# https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_46/gencode.v46.pc_transcripts.fa.gz
# can be gzipped
transcriptome: /home/jiayiwang/rhapsodist/data/reference/gencode.v46.pc_transcripts.fa.gz

# cDNA readlength is 71; sjdbOverhang = readLength - 1
sjdbOverhang: 70

# sampletags: unknown for this dataset; set to false to skip sampletag alignment
skip_sampletags: true

aligner: ['starsolo', 'kallisto', 'alevin', 'sbg']

# Required when 'sbg' is in the aligner list.
# The reference is built automatically from the STAR index and GTF above.
# To use a pre-built BD archive instead, set sbg_reference_url or sbg_reference_archive.
sbg_cwl: third_party/cwl/v2.2.1/rhapsody_pipeline_2.2.1.cwl

samples:
  - name: example_full
    uses:
      cb_umi_fq: "/home/gmoro/fastqs_eighth_scRNAseq/315641_1-Unmod_S4_R1_001.fastq.gz"
      cdna_fq: "/home/gmoro/fastqs_eighth_scRNAseq/315641_1-Unmod_S4_R2_001.fastq.gz"
      bead_version: enhanced
      species: 'human'
