repo_path: '.'

nthreads: 20
max_mem_mb: 14000

soloCellFilter: "EmptyDrops_CR"
cell_filtering: "emptydrops"
soloMultiMappers: "Unique"
soloUMIdedup: "Exact"
extraStarSoloArgs: ""

working_dir: output/simul

gtf_origin: "ensembl"

## Simulated genome: 100 chrom x 2000 bp = 200 kbp total.
## genomeSAindexNbases must be <= log2(GenomeLength)/2 - 1 ~ 7.8; use 7.
genomeSAindexNbases: 7

## Simulated reads are 100 bp; sjdbOverhang = readLength - 1
sjdbOverhang: 99

skip_sampletags: false
use_simulated: true

sim_n_cells: 1000
sim_n_genes: 100
sim_n_umis: 100
sim_seed: 42
sim_chr_len: 2000
sim_gene_pos: 1000
sim_read_len: 100

## Empty droplets: needed for alevin's knee-finder (bimodal count distribution)
sim_n_empty_droplets: 50000

## Sampletag simulation: 3 mouse tags, 100 reads per cell
sampletag_fa: "data/sampletags/mouse_sampletags.fa"
sim_n_sampletags: 3
sim_n_st_reads: 100

## SevenBridges / BD Rhapsody official pipeline (optional)
## Set sbg_cwl to the CWL workflow file. Place it under third_party/cwl/ (gitignored).
## For real data, optionally set sbg_reference_url or sbg_reference_archive.
## Without either, the reference is built from the STAR index and GTF.
sbg_cwl: third_party/cwl/v2.2.1/rhapsody_pipeline_2.2.1.cwl
# sbg_reference_url: "http://bd-rhapsody-public.s3-website-us-east-1.amazonaws.com/Rhapsody-WTA/Rhapsody_WTA_Analysis_Pipeline_Reference_Files_GRCh38_2022-09_gencode.v41.tar.gz"
# sbg_reference_archive: /path/to/Rhapsody_reference.tar.gz

aligner:
  - starsolo
  - kallisto
  - alevin
  - sbg

samples:
  - name: simulated
    uses:
      whitelist: 384x3
      species: 'mouse'
