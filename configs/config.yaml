repo_path: '.'

## run limits
nthreads: 10
max_mem_mb: 20000

## cell filtering
soloCellFilter: "EmptyDrops_CR" # None, TopCells, CellRanger2.2

# cell_filtering controls how cells are selected from raw count matrices.
# native: each aligner uses its own method (STARsolo: soloCellFilter, kallisto: barcodeRanks, alevin: barcodeRanks knee, SBG: built-in)
# emptydrops: apply DropletUtils::emptyDrops on raw/unfiltered counts for all aligners
# none: no cell filtering; keep every observed barcode (filter downstream yourself).
#       For STARsolo this overrides soloCellFilter to None.
cell_filtering: "native"

## multimappers
soloMultiMappers: "Unique" # Uniform, Rescue, PropUnique, EM

# alevin_sketch: use salmon alevin --sketch (faster, integer-like counts, no EM
# multi-mapper redistribution). Set true to match STARsolo Unique counting and
# keep UMI scales comparable across aligners. Set false to use the default
# graph-based EM deduplication, which produces fractional counts and inflates
# per-cell UMI totals relative to unique-only aligners.
alevin_sketch: false

# alevin_usa: build a spliced+unspliced (spliceu) reference and run alevin-fry in
# USA mode (cr-like-usa). The resulting SCE keeps the spliced counts as the main
# 'counts' assay (spliced plus ambiguous) and adds 'spliced', 'unspliced' and
# 'ambiguous' assays for RNA velocity. Requires alevin_sketch: true (USA counting
# is an alevin-fry feature). Needs the genome (for intron sequences) and a plain
# transcriptome is not used in this mode.
alevin_usa: false

## extra STARsolo arguments
extraStarSoloArgs: ""

## cb/umi harmonization tolerance: number of mismatches allowed in the fixed
## linker parts of the R1 adapter passed to cutadapt (-e). Integer >= 0.
## Default 0 (exact match). Increase to be more permissive on noisy reads.
cb_umi_max_errors: 0

## downsample reads before processing. Percentage in (0, 100]; 100 keeps all.
## Applied paired (same seed for R1/R2). Optional; default 100. Per-sample
## override via samples.uses.downsample.
downsample: 100
# downsample_seed: 42

## path where outputs will be generated; relative paths are resolved from the repo root
working_dir: output

gtf_origin: "gencode" # gencode or ensembl
# caution: uncompressed
gtf: /path/to/annotation.gtf

# caution: uncompressed
genome: /path/to/genome.fa

# gzipped or plain fasta both work (not used when alevin_usa is true)
transcriptome: /path/to/transcriptome.fa.gz

# readLength - 1
sjdbOverhang: 70

aligner: ['starsolo', 'kallisto', 'alevin']
# To also run the BD Rhapsody official pipeline, add 'sbg' to the list above
# and set sbg_cwl to the CWL workflow file:
# sbg_cwl: docker/cwl/v2.2.1/rhapsody_pipeline_2.2.1.cwl
# The reference is built automatically from STAR index + GTF unless you set:
# sbg_reference_url: "http://..."      # download from BD S3
# sbg_reference_archive: /path/to/archive.tar.gz  # use pre-built local copy

samples:
  - name: my_sample
    uses:
      cb_umi_fq: /path/to/R1.fastq.gz
      cdna_fq: /path/to/R2.fastq.gz
      # optional; all fields below default when absent. Bead chemistry is
      # auto-detected from R1 linkers; allowedlist/diversity_insets are used
      # as a QC check against the detection and for printing.
      # allowedlist: 384          # 96 or 384 (default: 384)
      # diversity_insets: yes     # yes or no (default: yes)
      # use_sampletags: no        # yes or no (default: follows global skip_sampletags)
      # species: human            # human or mouse; required when use_sampletags is yes
      # downsample: 100           # percentage in (0, 100]; default 100
