R: "R"
Rbin: "R"
STAR: STAR

repo_path: '.'

nthreads: 4
max_mem_mb: 14000

soloCellFilter: "EmptyDrops_CR"
soloMultiMappers: "Unique"
soloUMIdedup: "Exact"
extraStarSoloArgs: ""

working_dir: /tmp/rhapsodist_simulate

gtf_origin: "ensembl"

## Simulated genome: 100 chrom x 2000 bp = 200 kbp total.
## genomeSAindexNbases must be <= log2(GenomeLength)/2 - 1 ~ 7.8; use 7.
genomeSAindexNbases: 7

## Simulated reads are 100 bp; sjdbOverhang = readLength - 1
sjdbOverhang: 99

skip_sampletags: false
use_simulated: true

sim_n_cells: 1000
sim_n_genes: 100
sim_n_umis: 100
sim_seed: 42
sim_chr_len: 2000
sim_gene_pos: 1000
sim_read_len: 100

## Empty droplets: needed for alevin's knee-finder (bimodal count distribution)
sim_n_empty_droplets: 50000

## Sampletag simulation: 3 mouse tags, 100 reads per cell
sampletag_fa: "data/sampletags/mouse_sampletags.fa"
sim_n_sampletags: 3
sim_n_st_reads: 100

## SevenBridges / BD Rhapsody official pipeline (optional)
##
## Run mode: set sbg_cwl. The workflow generates the CWL input.yml from
## config values and runs:
##   cwltool --singularity --outdir <outdir> <cwl> input.yml
## cwltool pulls the BD Docker image from DockerHub automatically.
## Place the CWL file under docker/cwl/ (it is gitignored).
##
## Reference archive (BD_Rhapsody_Reference_Files/ tar.gz):
##   - Simulated data (use_simulated: true): auto-built from the simulated
##     STAR index + GTF. No extra config needed.
##   - Real data: either provide sbg_reference_url to download from the BD
##     public S3 bucket, or sbg_reference_archive for a pre-built local copy.
##     Available references:
##       http://bd-rhapsody-public.s3-website-us-east-1.amazonaws.com/Rhapsody-WTA/
##
sbg_cwl: docker/cwl/v3.0/rhapsody_pipeline_3.0.cwl
# sbg_sample_tags_version: mouse   # human | mouse (default: sample species)
# sbg_bead_version: EnhV2          # v1 | Enh | EnhV2 (default: Enh)
## For real data: download reference (mutually exclusive with sbg_reference_archive):
# sbg_reference_url: "http://bd-rhapsody-public.s3-website-us-east-1.amazonaws.com/Rhapsody-WTA/Rhapsody_WTA_Analysis_Pipeline_Reference_Files_GRCh38_2022-09_gencode.v41.tar.gz"
## Or point to a pre-built local copy:
# sbg_reference_archive: /path/to/Rhapsody_reference.tar.gz
##
## Ingest mode (no CWL re-run): provide sbg_mex_dir with pre-computed MEX output.
## Use per-sample subdirectories sbg_mex_dir/<sample>/ for multiple samples.
##
# sbg_mex_dir: /path/to/sbg/mex_output
##
## All options can be set per sample in uses: to override global values.

aligner:
  - starsolo
  - kallisto
  - alevin

samples:
  - name: simulated
    uses:
      whitelist: 384x3
      species: 'mouse'
