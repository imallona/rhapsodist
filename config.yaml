repo_path: '.'

## run limits
nthreads: 10
max_mem_mb: 20000

## cell filtering
soloCellFilter: "EmptyDrops_CR" # None, TopCells, CellRanger2.2

## multimappers
soloMultiMappers: "Unique" # Uniform, Rescue, PropUnique, EM

## extra STARsolo arguments
extraStarSoloArgs: ""

## full, absolute path where outputs will be generated
working_dir: /path/to/output

gtf_origin: "gencode" # gencode or ensembl
# caution: uncompressed
gtf: /path/to/annotation.gtf

# caution: uncompressed
genome: /path/to/genome.fa

# can be gzipped
transcriptome: /path/to/transcriptome.fa.gz

# readLength - 1
sjdbOverhang: 70

aligner: ['starsolo', 'kallisto', 'alevin']
# To also run the BD Rhapsody official pipeline, add 'sbg' to the list above
# and set sbg_cwl to the CWL workflow file:
# sbg_cwl: docker/cwl/v2.2.1/rhapsody_pipeline_2.2.1.cwl
# The reference is built automatically from STAR index + GTF unless you set:
# sbg_reference_url: "http://..."      # download from BD S3
# sbg_reference_archive: /path/to/archive.tar.gz  # use pre-built local copy

samples:
  - name: my_sample
    uses:
      cb_umi_fq: /path/to/R1.fastq.gz
      cdna_fq: /path/to/R2.fastq.gz
      whitelist: 96x3  # 96x3 for Enh beads (96 seqs/component), 384x3 for EnhV2 beads (384 seqs/component)
      species: 'human'  # human or mouse
