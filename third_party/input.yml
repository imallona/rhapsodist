#!/usr/bin/env cwl-runner
## Template input file for the BD Rhapsody CWL pipeline.
## When running via Snakemake (rule run_sbg_cwl), this file is generated
## automatically in {working_dir}/sbg/{sample}/input.yml.
## For manual runs copy this template and adjust the paths below, then:
##   cd docker
##   cwltool --singularity --outdir ./testrun cwl/v3.0/rhapsody_pipeline_3.0.cwl input.yml

cwl:tool: rhapsody

Reads:
  - class: File
    location: "/path/to/sample_R1_001.fastq.gz"   ## cb+umi read
  - class: File
    location: "/path/to/sample_R2_001.fastq.gz"   ## cDNA read

Reference_Archive:
    class: File
    location: "/path/to/Rhapsody_reference.tar.gz"

Sample_Tags_Version: human   ## human | mouse

## Force short-read (STAR) mode; omit or set true for PacBio/Nanopore.
Long_Reads: false




