name: tests

on:
  pull_request:
    branches: [main]
    # 'labeled' lets a PR start integration-sampletags via the 'integration' label
    # (the dispatch button only shows on the default branch).
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install test dependencies
        run: pip install pytest pytest-cov

      - name: run unit tests with coverage
        run: pytest

  r-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: r-tests
          create-args: >-
            r-base
            bioconductor-s4vectors
            r-matrix
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: run gtf_utils R tests
        run: Rscript workflow/tests/test_gtf_utils.R

      - name: run USA assay collapse R tests
        run: Rscript workflow/tests/test_usa_collapse.R

  # Per-sampletag split tests. Needs the SCE/HDF5/anndataR stack (heavier than the
  # light r-unit-tests job above), so it runs as its own job. Checks backend
  # equivalence, the source-count match, the h5ad round-trip, and logs backend scaling.
  r-split-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: r-split-tests
          create-args: >-
            r-base
            bioconductor-singlecellexperiment
            bioconductor-hdf5array
            bioconductor-anndatar
            r-matrix
            r-data.table
            r-argparse
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: run sampletag split R tests
        run: cd workflow && Rscript tests/test_split_sce_by_sampletag.R

  integration-dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: snakemake
          create-args: python=3.12 snakemake
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: dry-run simulation workflow
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_config.yaml \
            --config "aligner=['starsolo','alevin']" \
            --dry-run \
            --nolock \
            --cores 2

      - name: dry-run with cell_filtering none
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_config.yaml \
            --config "aligner=['starsolo','alevin']" cell_filtering=none \
            --dry-run \
            --nolock \
            --cores 2

      - name: dry-run alevin USA mode
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_usa_config.yaml \
            --dry-run \
            --nolock \
            --cores 2

      # single-aligner run: the cross-pipeline comparison report must be skipped.
      # Add a dry-run step here for every new simulation config that ships a fix.
      - name: dry-run single-aligner search config
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_config_search.yaml \
            --dry-run \
            --nolock \
            --cores 2

      # gencode-ordered GTF: checks get_txp2gene parses attributes by name
      - name: dry-run gencode gtf config
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_config_gencode.yaml \
            --dry-run \
            --nolock \
            --cores 2

      # kallisto-only config, used by the integration-kallisto job
      - name: dry-run kallisto-only config
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_kallisto.yaml \
            --dry-run \
            --nolock \
            --cores 2

      # per-sample sampletags wiring, search mode (mapping form) and starsolo mode (list form)
      - name: dry-run sampletags search scenario
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_search_sampletags.yaml \
            --dry-run \
            --nolock \
            --cores 2

      - name: dry-run sampletags starsolo scenario
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_starsolo_sampletags.yaml \
            --dry-run \
            --nolock \
            --cores 2

      # output_format both adds the sce_to_h5ad targets to the DAG; the delayed
      # split backend keeps the original lazy path reachable.
      - name: dry-run h5ad output and delayed split backend
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_starsolo_sampletags.yaml \
            --config output_format=both sampletag_split_backend=delayed \
            --dry-run \
            --nolock \
            --cores 2

  sbg-singularity-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: snakemake
          create-args: python=3.12 snakemake
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: dry-run must fail when sbg is enabled without singularity
        run: |
          ## Restrict PATH to the conda env plus minimal system bins so
          ## singularity/apptainer are hidden even if the runner image ships them.
          guarded_path="$CONDA_PREFIX/bin:/usr/bin:/bin"
          if PATH="$guarded_path" command -v singularity >/dev/null 2>&1 \
             || PATH="$guarded_path" command -v apptainer >/dev/null 2>&1; then
            echo "singularity/apptainer leaked into guarded PATH; test precondition broken"
            exit 1
          fi
          set +e
          output=$(PATH="$guarded_path" snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_config.yaml \
            --config "aligner=['sbg']" sbg_cwl=third_party/cwl/v2.2.1/rhapsody_pipeline_2.2.1.cwl \
            --dry-run \
            --nolock \
            --cores 2 2>&1)
          status=$?
          echo "$output"
          if [ $status -eq 0 ]; then
            echo "expected snakemake to fail but it exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q "neither 'singularity' nor 'apptainer'"; then
            echo "expected singularity guard error message not found"
            exit 1
          fi

  integration-run:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'integration'))
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: snakemake
          create-args: python=3.12 snakemake
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: cache conda environments created by snakemake
        uses: actions/cache@v4
        with:
          path: .snakemake/conda
          key: snakemake-conda-${{ hashFiles('workflow/envs/all_in_one.yaml') }}

      - name: run simulation workflow
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_config.yaml \
            --config "aligner=['starsolo','alevin']" \
            --cores 2 \
            --use-conda \
            --nolock \
            --rerun-incomplete

      - name: cat logs on failure
        if: failure()
        run: |
          for f in $(find output/simul -path '*/logs/*.log' 2>/dev/null) .snakemake/log/*.log; do
            [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; }
          done

      - name: run simulation with cell_filtering none
        run: |
          ## guards the whole no-filter run; STARsolo with soloCellFilter
          ## None only writes raw/, so the rule must mirror it into filtered/
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_config.yaml \
            --config "aligner=['starsolo','alevin']" cell_filtering=none \
            --cores 2 \
            --use-conda \
            --nolock \
            --rerun-incomplete \
            "$PWD/output/simul/starsolo/simulated/simulated_starsolo_sce.rds" \
            "$PWD/output/simul/alevin/simulated/simulated_alevin_sce.rds"

      - name: upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-reports
          path: |
            output/simul/logs/
            .snakemake/log/
            output/simul/**/*.html
          if-no-files-found: ignore

  # End-to-end test of per-sample sampletags (tag restriction and per-tag splits).
  # Builds conda envs, so it is opt-in: add the 'integration' label to a PR, or use
  # the Actions tab on the default branch.
  integration-sampletags:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'integration'))
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: snakemake
          create-args: python=3.12 snakemake
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: cache conda environments created by snakemake
        uses: actions/cache@v4
        with:
          path: .snakemake/conda
          key: snakemake-conda-${{ hashFiles('workflow/envs/all_in_one.yaml') }}

      # .verified runs the pipeline, the split, then verify_sampletag_splits.R; it
      # fails on a malformed or missing per-tag split.
      # Memory backend, end to end. output_format=both also exercises the h5ad export:
      # the split still writes the HDF5 SCE (so .verified runs) and the sce_to_h5ad rule
      # produces the main h5ad via anndataR. Building the .h5ad target fails the job if
      # the conversion breaks.
      - name: run and verify search-mode scenario (memory backend, with h5ad output)
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_search_sampletags.yaml \
            --config output_format=both sampletag_split_backend=memory \
            --cores 2 \
            --use-conda \
            --nolock \
            --rerun-incomplete \
            "$PWD/output/simul_search_sampletags/alevin/simulated/by_sampletag/.verified" \
            "$PWD/output/simul_search_sampletags/alevin/simulated/simulated_alevin.h5ad"

      # Delayed backend, end to end, so both split backends are verified on simulated data.
      - name: run and verify starsolo-mode scenario (delayed backend, starsolo and alevin)
        run: |
          targets=""
          for aligner in starsolo alevin; do
            targets="$targets $PWD/output/simul_starsolo_sampletags/$aligner/simulated/by_sampletag/.verified"
          done
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_starsolo_sampletags.yaml \
            --config sampletag_split_backend=delayed \
            --cores 2 \
            --use-conda \
            --nolock \
            --rerun-incomplete \
            $targets

      - name: cat logs on failure
        if: failure()
        run: |
          for f in $(find output/simul_search_sampletags output/simul_starsolo_sampletags -path '*/logs/*.log' 2>/dev/null) .snakemake/log/*.log; do
            [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; }
          done

      - name: upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sampletags-logs-and-reports
          path: |
            output/simul_search_sampletags/logs/
            output/simul_starsolo_sampletags/logs/
            output/**/*sampletag*.html
            output/**/by_sampletag/**/split_summary.rds
          if-no-files-found: ignore

  # kallisto-only run. kallisto is self-compiled (bioconda kallisto hits Illegal
  # instruction on CPUs without AVX). It runs up to the bus file and checks the
  # content. bustools correct is not required to finish: bustools 0.45.1 reserves
  # ~20 GB regardless of input, which the ~7 GB runner cannot give, so it is run
  # only to record the limit. Opt-in via the 'integration' label.
  integration-kallisto:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'integration'))
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: snakemake
          create-args: python=3.12 snakemake
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: cache conda environments created by snakemake
        uses: actions/cache@v4
        with:
          path: .snakemake/conda
          key: snakemake-conda-${{ hashFiles('workflow/envs/all_in_one.yaml') }}

      - name: build the kallisto bus file
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_kallisto.yaml \
            --cores 2 \
            --use-conda \
            --nolock \
            --rerun-incomplete \
            "$PWD/output/simul_kallisto/kallisto/simulated/output.sorted.bus"

      - name: check bus content (bustools correct exceeds runner memory)
        run: |
          bus=output/simul_kallisto/kallisto/simulated/output.sorted.bus
          # BUS header: 4-byte magic 'BUS\0', then little-endian uint32 version,
          # barcode length, UMI length. Read them without bustools.
          magic=$(head -c 3 "$bus")
          bclen=$(od -An -tu4 -j 8 -N 4 "$bus" | tr -d ' ')
          umilen=$(od -An -tu4 -j 12 -N 4 "$bus" | tr -d ' ')
          echo "bus header: magic=$magic bclen=$bclen umilen=$umilen"
          if [ "$magic" != "BUS" ] || [ "$bclen" != "27" ] || [ "$umilen" != "8" ]; then
            echo "bus file content is wrong"; exit 1
          fi
          # bustools correct reserves ~20 GB regardless of input (bustools 0.45.1); the
          # runner has ~7 GB, so it aborts. That is a bustools limit, not a pipeline bug:
          # the bus file above is well-formed. Run it once to record the behaviour.
          bt=$(find .snakemake/conda -path '*/bin/bustools' 2>/dev/null | head -1)
          wl=output/simul_kallisto/simulate/cell_barcodes.txt
          set +e
          "$bt" correct -w "$wl" -o /tmp/corrected.bus "$bus"
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "bustools correct exceeded memory (exit $rc); bus content is correct, so the kallisto mode is validated."
          else
            echo "bustools correct succeeded on this runner."
          fi

      - name: diagnostics on failure
        if: failure()
        run: |
          free -h || true
          ulimit -a || true
          ./output/simul_kallisto/software/kallisto/build/src/kallisto version || true
          ## bustools is in the kallisto conda env; print the bus header to check it
          bt=$(find .snakemake/conda -path '*/bin/bustools' 2>/dev/null | head -1)
          bus=output/simul_kallisto/kallisto/simulated/output.sorted.bus
          echo "bustools: $bt"; [ -n "$bt" ] && "$bt" version || true
          ## raw bus header (magic, version, then barcode/umi/text lengths) in case inspect crashes
          [ -f "$bus" ] && od -A d -t x1 -N 32 "$bus" || true
          [ -n "$bt" ] && [ -f "$bus" ] && "$bt" inspect "$bus" || true
          for f in $(find output/simul_kallisto -path '*/logs/*.log' 2>/dev/null) .snakemake/log/*.log; do
            [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; }
          done

      - name: upload logs and bus files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kallisto-debug
          path: |
            output/simul_kallisto/logs/
            output/simul_kallisto/kallisto/simulated/*.bus
            output/simul_kallisto/kallisto/simulated/matrix.ec
            output/simul_kallisto/kallisto/simulated/transcripts.txt
            output/simul_kallisto/simulate/cell_barcodes.txt
            .snakemake/log/
          if-no-files-found: ignore
