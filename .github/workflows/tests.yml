name: tests

on:
  pull_request:
    branches: [main]
    # 'labeled' lets a PR start integration-sampletags via the 'integration' label
    # (the dispatch button only shows on the default branch).
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install test dependencies
        run: pip install pytest pytest-cov

      - name: run unit tests with coverage
        run: pytest

  r-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: r-tests
          create-args: >-
            r-base
            bioconductor-s4vectors
            r-matrix
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: run gtf_utils R tests
        run: Rscript workflow/tests/test_gtf_utils.R

      - name: run USA assay collapse R tests
        run: Rscript workflow/tests/test_usa_collapse.R

  integration-dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: snakemake
          create-args: python=3.12 snakemake
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: dry-run simulation workflow
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_config.yaml \
            --config "aligner=['starsolo','alevin']" \
            --dry-run \
            --nolock \
            --cores 2

      - name: dry-run with cell_filtering none
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_config.yaml \
            --config "aligner=['starsolo','alevin']" cell_filtering=none \
            --dry-run \
            --nolock \
            --cores 2

      - name: dry-run alevin USA mode
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_usa_config.yaml \
            --dry-run \
            --nolock \
            --cores 2

      # single-aligner run: the cross-pipeline comparison report must be skipped.
      # Add a dry-run step here for every new simulation config that ships a fix.
      - name: dry-run single-aligner search config
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_config_search.yaml \
            --dry-run \
            --nolock \
            --cores 2

      # gencode-ordered GTF: checks get_txp2gene parses attributes by name
      - name: dry-run gencode gtf config
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_config_gencode.yaml \
            --dry-run \
            --nolock \
            --cores 2

      # per-sample sampletags wiring, search path (mapping form) and starsolo path (list form)
      - name: dry-run sampletags search scenario
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_search_sampletags.yaml \
            --dry-run \
            --nolock \
            --cores 2

      - name: dry-run sampletags starsolo scenario
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_starsolo_sampletags.yaml \
            --dry-run \
            --nolock \
            --cores 2

  sbg-singularity-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: snakemake
          create-args: python=3.12 snakemake
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: dry-run must fail when sbg is enabled without singularity
        run: |
          ## Restrict PATH to the conda env plus minimal system bins so
          ## singularity/apptainer are hidden even if the runner image ships them.
          guarded_path="$CONDA_PREFIX/bin:/usr/bin:/bin"
          if PATH="$guarded_path" command -v singularity >/dev/null 2>&1 \
             || PATH="$guarded_path" command -v apptainer >/dev/null 2>&1; then
            echo "singularity/apptainer leaked into guarded PATH; test precondition broken"
            exit 1
          fi
          set +e
          output=$(PATH="$guarded_path" snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_config.yaml \
            --config "aligner=['sbg']" sbg_cwl=third_party/cwl/v2.2.1/rhapsody_pipeline_2.2.1.cwl \
            --dry-run \
            --nolock \
            --cores 2 2>&1)
          status=$?
          echo "$output"
          if [ $status -eq 0 ]; then
            echo "expected snakemake to fail but it exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q "neither 'singularity' nor 'apptainer'"; then
            echo "expected singularity guard error message not found"
            exit 1
          fi

  integration-run:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: snakemake
          create-args: python=3.12 snakemake
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: cache conda environments created by snakemake
        uses: actions/cache@v4
        with:
          path: .snakemake/conda
          key: snakemake-conda-${{ hashFiles('workflow/envs/all_in_one.yaml') }}

      - name: run simulation workflow
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_config.yaml \
            --config "aligner=['starsolo','alevin']" \
            --cores 2 \
            --use-conda \
            --nolock \
            --rerun-incomplete

      - name: run simulation with cell_filtering none
        run: |
          ## guards the whole no-filter run; STARsolo with soloCellFilter
          ## None only writes raw/, so the rule must mirror it into filtered/
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_config.yaml \
            --config "aligner=['starsolo','alevin']" cell_filtering=none \
            --cores 2 \
            --use-conda \
            --nolock \
            --rerun-incomplete \
            "$PWD/output/simul/starsolo/simulated/simulated_starsolo_sce.rds" \
            "$PWD/output/simul/alevin/simulated/simulated_alevin_sce.rds"

      - name: upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-reports
          path: |
            output/simul/logs/
            .snakemake/log/
            output/simul/**/*.html
          if-no-files-found: ignore

  # End-to-end test of per-sample sampletags (tag restriction and per-tag splits).
  # Builds conda envs, so it is opt-in: add the 'integration' label to a PR, or use
  # the Actions tab on the default branch.
  integration-sampletags:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'integration'))
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: snakemake
          create-args: python=3.12 snakemake
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: cache conda environments created by snakemake
        uses: actions/cache@v4
        with:
          path: .snakemake/conda
          key: snakemake-conda-${{ hashFiles('workflow/envs/all_in_one.yaml') }}

      # .verified runs the pipeline, the split, then verify_sampletag_splits.R; it
      # fails on a malformed or missing per-tag split.
      - name: run and verify search-path scenario (mapping form)
        run: |
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_search_sampletags.yaml \
            --cores 2 \
            --use-conda \
            --nolock \
            --rerun-incomplete \
            "$PWD/output/simul_search_sampletags/alevin/simulated/by_sampletag/.verified"

      - name: run and verify starsolo-path scenario (list form, all aligners)
        run: |
          targets=""
          for aligner in starsolo kallisto alevin; do
            targets="$targets $PWD/output/simul_starsolo_sampletags/$aligner/simulated/by_sampletag/.verified"
          done
          snakemake \
            --snakefile workflow/Snakefile \
            --configfile configs/sim_starsolo_sampletags.yaml \
            --cores 2 \
            --use-conda \
            --nolock \
            --rerun-incomplete \
            $targets

      - name: upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sampletags-logs-and-reports
          path: |
            output/simul_search_sampletags/logs/
            output/simul_starsolo_sampletags/logs/
            output/**/*sampletag*.html
            output/**/by_sampletag/**/split_summary.rds
          if-no-files-found: ignore
