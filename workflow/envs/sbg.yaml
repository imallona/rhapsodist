name: noname
channels:
  - conda-forge
  - nodefaults
dependencies:
  - conda-forge::cwl_runner
  ## schema-salad is pulled in by cwltool but pinning it avoids resolver conflicts
  - conda-forge::schema-salad
  - conda-forge::pyyaml ## python helper
  ## lets cwltool evaluate CWL expressions without starting a node container
  - conda-forge::nodejs
